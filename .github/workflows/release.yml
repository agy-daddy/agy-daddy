name: Release & Publish npm Packages

on:
  push:
    tags:
      - 'v*.*.*'
      - 'host@*'
      - 'plugin-*@*'
      - 'registry@*'
  workflow_dispatch:
    inputs:
      environment:
        description: Target release channel
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      target:
        description: 'Package target (all, host, plugin-quota, or release tag)'
        required: true
        type: string
        default: all
      dry_run:
        description: Preview publish without mutating npm registry
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight-verify:
    name: Preflight Verify & Release Plan
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      target: ${{ steps.resolve.outputs.target }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Resolve release parameters
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_NAME="${{ inputs.environment }}"
            TARGET="${{ inputs.target }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            TARGET="${GITHUB_REF_NAME}"
            DRY_RUN="false"
            if echo "${GITHUB_REF_NAME}" | grep -qE -- '-(alpha|beta|rc)\.'; then
              ENV_NAME="staging"
            else
              ENV_NAME="production"
            fi
          fi
          echo "environment=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Build and verify Web UIs
        run: |
          for dir in agy-daddy-plugin-remote/web agy-daddy-plugin-web/web; do
            (cd "$dir" && npm ci && npm run typecheck && npm test && npm run build)
          done

      - name: Run full monorepo verification
        run: npm run verify

      - name: Validate release plan consistency
        run: node scripts/release.js plan --env "${{ steps.resolve.outputs.environment }}" --target "${{ steps.resolve.outputs.target }}"

  pack-snapshot:
    name: Pack Tarball and Launcher Snapshot
    needs: preflight-verify
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Build host renderer & pack snapshot tarballs
        run: |
          npm run build
          node scripts/release.js pack \
            --env "${{ needs.preflight-verify.outputs.environment }}" \
            --target "${{ needs.preflight-verify.outputs.target }}" \
            --out-dir ".release-artifacts/snapshot" \
            --skip-verify

      - name: Build three launcher downloads
        env:
          RELEASE_CHANNEL: ${{ needs.preflight-verify.outputs.environment }}
        run: |
          npm_tag=latest
          if [ "$RELEASE_CHANNEL" = staging ]; then npm_tag=next; fi
          native_tray=".release-artifacts/macos-tray/Agy-Daddy Tray.app"
          bash scripts/wrappers/macos/prepare-tray.sh "$native_tray"
          npm run build:wrappers -- --tag "$npm_tag" --macos-tray "$native_tray" \
            --out-dir ".release-artifacts/snapshot/wrappers"

      - name: Upload release snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: .release-artifacts/snapshot/
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    name: Publish to npm via OIDC (${{ needs.preflight-verify.outputs.environment }})
    needs: [preflight-verify, pack-snapshot]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x (pure OIDC, no registry-url token stub)
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Verify npm CLI >= 11.5.1 for Trusted Publishing
        run: |
          NPM_VER="$(npm --version)"
          echo "Current npm version: ${NPM_VER}"
          if ! node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            process.exit(ok ? 0 : 1);
          ' "$NPM_VER"; then
            echo "Upgrading npm to latest (>= 11.5.1 required for OIDC Trusted Publishing)..."
            npm install -g npm@latest
            npm --version
          fi

      - name: Build host renderer
        run: npm run build

      - name: Publish packages via Trusted Publishing (OIDC)
        run: |
          if [ "${{ needs.preflight-verify.outputs.dry_run }}" = "true" ]; then
            env -u NODE_AUTH_TOKEN -u NPM_TOKEN node scripts/release.js publish \
              --env "${{ needs.preflight-verify.outputs.environment }}" \
              --target "${{ needs.preflight-verify.outputs.target }}" \
              --dry-run \
              --skip-verify
          else
            env -u NODE_AUTH_TOKEN -u NPM_TOKEN node scripts/release.js publish \
              --env "${{ needs.preflight-verify.outputs.environment }}" \
              --target "${{ needs.preflight-verify.outputs.target }}" \
              --execute \
              --skip-verify
          fi

  post-release-verify:
    name: Post-Release Healthcheck & GitHub Release
    needs: [preflight-verify, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Download release snapshot
        uses: actions/download-artifact@v4
        with:
          name: release-snapshot
          path: .release-artifacts/snapshot/

      - name: Verify local bundle & doctor healthcheck
        run: |
          npm run build
          node scripts/release.js healthcheck --mode local

      - name: Verify downloaded launcher checksums
        working-directory: .release-artifacts/snapshot/wrappers
        run: sha256sum -c agy-daddy-wrappers-sha256sums.txt

      - name: Verify npm registry healthcheck
        if: needs.preflight-verify.outputs.dry_run != 'true'
        run: |
          node scripts/release.js healthcheck \
            --mode npm \
            --env "${{ needs.preflight-verify.outputs.environment }}" \
            --target "${{ needs.preflight-verify.outputs.target }}" \
            --retries 6 \
            --retry-delay-ms 5000

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/') && needs.preflight-verify.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.preflight-verify.outputs.environment }}
        run: |
          release_flags=()
          if [ "$RELEASE_CHANNEL" = staging ]; then release_flags+=(--prerelease); fi
          wrapper_dir=".release-artifacts/snapshot/wrappers"
          gh release create "${GITHUB_REF_NAME}" \
            .release-artifacts/snapshot/release-manifest.json \
            "$wrapper_dir/agy-daddy-launcher-macos.zip" \
            "$wrapper_dir/agy-daddy-launcher-windows.zip" \
            "$wrapper_dir/agy-daddy-launcher-linux.tar.gz" \
            "$wrapper_dir/agy-daddy-wrappers-sha256sums.txt" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes "${release_flags[@]}"

      - name: Emit rollback instructions & optional webhook on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.RELEASE_ALERT_WEBHOOK_URL }}
        run: |
          echo "::error::Release verification failed for target=${{ needs.preflight-verify.outputs.target }} env=${{ needs.preflight-verify.outputs.environment }}"
          echo "Run rollback locally:"
          echo "node scripts/release.js rollback --env ${{ needs.preflight-verify.outputs.environment }} --target ${{ needs.preflight-verify.outputs.target }} --to-version <prev-version> --execute"
          if [ -n "${ALERT_WEBHOOK_URL:-}" ]; then
            node -e '
              const url = process.env.ALERT_WEBHOOK_URL;
              const payload = {
                event: "release_failed",
                repository: process.env.GITHUB_REPOSITORY,
                ref: process.env.GITHUB_REF_NAME,
                env: "${{ needs.preflight-verify.outputs.environment }}",
                target: "${{ needs.preflight-verify.outputs.target }}",
                runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
              };
              fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
              }).catch((e) => console.warn("Webhook notify failed:", e.message));
            '
          fi
